name: install

env:
  # MaaFramework 的版本须与 requirements.txt 中的 MaaFw 一致。
  MAAFW_VERSION: "v6.0.0-beta.3"
  MXU_VERSION: "v2.11.2"

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "requirements.txt"
      - "tools/requirements.txt"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "requirements.txt"
      - "tools/requirements.txt"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=false
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
            is_release=true
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
              echo "::error::Invalid release tag: $tag"
              exit 1
            fi
          else
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || echo v0.0.0)
            tag="${base%%-*}-ci.$(git rev-parse --short HEAD)"
          fi

          is_prerelease=false
          if [[ "$tag" == *-* ]]; then
            is_prerelease=true
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'is_release=%s\n' "$is_release"
            printf 'is_prerelease=%s\n' "$is_prerelease"
          } >> "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [win]
        arch: [x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}-${{ env.MAAFW_VERSION }}.zip"
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Download MXU
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MXU
          fileName: "MXU-${{ matrix.os }}-${{ matrix.arch }}-${{ env.MXU_VERSION }}.zip"
          tag: ${{ env.MXU_VERSION }}
          out-file-path: "deps/mxu"
          extract: true

      - name: Download legacy Minitouch
        uses: robinraju/release-downloader@v1
        with:
          repository: EvATive7/minitouch
          fileName: minitouch.zip
          tag: v2.0.0
          out-file-path: deps/legacy-touch

      - name: Install
        env:
          VERSION: ${{ needs.meta.outputs.tag }}
          IS_RELEASE: ${{ needs.meta.outputs.is_release }}
        run: |
          cd deps/legacy-touch
          echo '4bed7a1628bc1272f1835bc4f1522868e6956846c8120a8d76a0ee0aa389e549  minitouch.zip' | sha256sum --check
          unzip -q minitouch.zip
          cd ../..
          mv deps/legacy-touch/minitouch deps/minitouch_EvATive7
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/EvATive7/minitouch/4c22b45f1b7b5bfa47c6f96535d3e0d3751b3d34/LICENSE \
            --output deps/minitouch_EvATive7/LICENSE
          python -m pip install -r tools/requirements.txt
          args=("$VERSION" '${{ matrix.os }}' '${{ matrix.arch }}')
          if [[ "$IS_RELEASE" == true ]]; then
            args+=(--release)
          fi
          python tools/install.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: MAautodori-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  portable:
    needs: [meta, install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.4"
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: MAautodori-win-x86_64
          path: install
      - name: Build and verify portable ZIP
        run: python tools/package_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-win-x64
          path: build/portable/MAautodori-win-x64-${{ needs.meta.outputs.tag }}.zip
          if-no-files-found: error
          compression-level: 0

  changelog:
    name: Generate changelog
    needs: meta
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, portable, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-win-x64
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          name: MAautodori ${{ needs.meta.outputs.tag }}
          files: assets/MAautodori-win-x64-${{ needs.meta.outputs.tag }}.zip
          fail_on_unmatched_files: true
          tag_name: ${{ needs.meta.outputs.tag }}
          body: |
            下载 Windows x64 便携 ZIP，完整解压后打开 `mxu.exe`。包内含 Python、Agent 依赖、OCR 和触控组件。MuMu 和游戏请自行安装，并在游戏中完成登录。[配置与使用说明](https://github.com/${{ github.repository }}/blob/${{ needs.meta.outputs.tag }}/README.md)

            本项目为第三方工具。使用本工具产生的后果由使用者自行承担。

            ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'MaaXYZ' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
